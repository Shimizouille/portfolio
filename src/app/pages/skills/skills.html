<div class="m-5 mb-20 md:mt-10 md:mb-20 md:mx-20 h-[calc(100vh-125px)] overflow-hidden">
    <div class="tabs">
        <button (click)="setTab('formations')" [class.active]="activeTab === 'formations'">
            Formations
        </button>
        <button (click)="setTab('experiences')" [class.active]="activeTab === 'experiences'">
            Expériences
        </button>
    </div>

    <!-- Filtres -->
    <div class="filters flex flex-col">
        <!-- Tags -->
        <div class="flex flex-col">
            <label>Tags :</label>
            <button type="button" (click)="openTagsModal()">
                Choisir les tags ({{ getSelectedTagsCount() }} sélectionnés)
            </button>
        </div>

        <!-- Filtre Entreprises -->
        <div  class="flex flex-col">
            <label>Entreprise :</label>
            <select [(ngModel)]="selectedEntreprise" (change)="updateFilteredItems()">
                <option value="">Toutes les entreprises/centres</option>
                <option *ngFor="let ent of entreprisesList" [value]="ent">{{ ent }}</option>
            </select>
        </div>

        <!-- Bouton reset -->
        <div class="flex flex-row justify-end">
            <button type="button" (click)="resetFilters()">Réinitialiser</button>
        </div>
    </div>

    <!-- Liste des cartes -->
    <div class="cards-container overflow-y-auto max-h-[calc(100vh-400px)] sm:max-h-[calc(100vh-350px)] md:max-h-[calc(100vh-300px)]">
        @for (item of filteredItems; track item) {
            <div class="card flex flex-col">
                <div class="flex flex-row justify-between mb-3">
                    <p>{{ item.date }}</p>
                    <p><strong>{{ getOrganisation(item) }}</strong></p>
                </div>
                <h3 class="text-xl font-bold">{{ getTitre(item) }}</h3>
                <p class="mb-3">{{ item.description }}</p>
                <div class="tags">
                    @for (tag of item.tags; track tag) {
                        <span class="tag" 
                            [style.background-color]="getColorForTag(tag)" 
                            [style.color]="getTextColor(getColorForTag(tag))">
                                {{ tag }}
                        </span>
                    }
                </div>
            </div>
        } @empty {
            <li>There are no items.</li>
        }
    </div>

    <div class="flex flex-row justify-end pt-2 md:pt-10">
        <a href="assets/data/Linkedin_CV_Claire_SAY.pdf" target="_blank" class="underline">Mon cv en version PDF</a>
    </div>

    <!-- ================= -->
    <!-- Modal Tags Mobile -->
    <!-- ================= -->
    <div class="modal" *ngIf="showTagsModal">
    <div class="modal-header">
        <input 
        type="text" 
        placeholder="Rechercher un tag..." 
        [(ngModel)]="tagSearch" 
        />
        <button (click)="closeTagsModal()">Fermer</button>
    </div>

    <div class="modal-body">
        <div class="modal-actions">
        <button (click)="toggleAllTags(true)">Tout cocher</button>
        <button (click)="toggleAllTags(false)">Tout décocher</button>
        </div>

        <div *ngFor="let tag of filteredTags()">
        <input 
            type="checkbox" 
            [(ngModel)]="selectedTagsMap[tag]" 
            (change)="updateFilteredItems()" 
        />
        {{ tag }}
        </div>
    </div>
    
</div>
